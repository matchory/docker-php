# Matchory supply chain baseline:
# https://github.com/matchory/.github/blob/main/supply-chain/STANDARD.md
#
# Dependabot covers GitHub Actions and Docker. Every real base image here is
# ARG-templated (php:${PHP_VERSION}-cli, ghcr.io/php/pie:${PIE_VERSION}-bin),
# which Dependabot does not interpolate, so the docker entry finds little to
# update: the ARG pins stay with Renovate (renovate.json).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: &schedule
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown: &cooldown
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups: &groups
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directory: /
    schedule: *schedule
    cooldown: *cooldown
    groups: *groups
    labels: [dependencies, docker]
