# Matchory supply chain baseline:
# https://github.com/matchory/.github/blob/main/supply-chain/STANDARD.md
#
# Dependabot covers GitHub Actions. Every base image here is ARG-templated
# (php:${PHP_VERSION}-cli, ghcr.io/php/pie:${PIE_VERSION}-bin), which
# Dependabot does not interpolate (dependabot-core#2057), so the ARG pins stay
# with Renovate (renovate.json).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, github-actions]
